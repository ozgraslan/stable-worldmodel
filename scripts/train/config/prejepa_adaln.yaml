defaults:
  - _self_
  - launcher: local
  - data: pusht

# --- Run ---
output_model_name: pusht_${backbone.type}_p${predictor.type}

num_workers: 16
train_split: 0.9
seed: 42
image_size: 224
patch_size: 14  # must match the encoder's patch size (14 for dinov2/dino/mae)
dump_object: true
save_step_interval: 5000


loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

# --- Backbone ---
backbone:
  name: dinov2_small
  type: dinov2_small
  interpolate_pos_encoding: true  # set to false for CNN backbones (e.g. resnet)


# --- World model ---
wm:
  history_size: 3
  num_preds: 1
  # cls, cls+reg (CLS and register tokens), or patches
  image_representation: cls
  extra_fusion: feature  # feature (legacy) or token (V-JEPA 2-AC style)
  encoding:
    proprio: 10
    action: 10

predictor:
  type: small  # used in output_model_name only
  depth: 6
  hidden_dim: null  # defaults to the encoder output dimension
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

model:
  _target_: stable_worldmodel.wm.AdaLNPreJEPA
  history_size: ${wm.history_size}
  num_pred: ${wm.num_preds}
  interpolate_pos_encoding: ${backbone.interpolate_pos_encoding}
  image_representation: ${wm.image_representation}
  extra_fusion: ${wm.extra_fusion}
  encoder:
    _target_: stable_worldmodel.wm.prejepa.module.create_backbone
    name: ${backbone.name}
  predictor:
    _target_: stable_worldmodel.wm.prejepa.module.AdaLNCausalPredictor
    num_patches: ???
    num_frames: ${wm.history_size}
    dim: ???
    hidden_dim: ${predictor.hidden_dim}
    depth: ${predictor.depth}
    heads: ${predictor.heads}
    mlp_dim: ${predictor.mlp_dim}
    dim_head: ${predictor.dim_head}
    dropout: ${predictor.dropout}
    emb_dropout: ${predictor.emb_dropout}
    condition_dim: ???

# --- Optimizer ---
optimizer:
  type: AdamW
  lr: 5e-4
  weight_decay: 0.0

# --- Trainer ---
trainer:
  default_root_dir: ${oc.env:STABLEWM_HOME}/checkpoints/${subdir}/pl_trainer
  max_steps: 100000
  strategy: ddp
  devices: auto
  accelerator: gpu
  precision: 16-mixed
  gradient_clip_val: 1.0
