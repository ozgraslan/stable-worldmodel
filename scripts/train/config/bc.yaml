defaults:
  - launcher: local
  - data: maniskill_state_overhead
  - _self_

output_model_name: state_bc_overhead
subdir: ${output_model_name}_${now:%Y-%m-%d_%H-%M-%S}
# Match the state LeWM training settings.
seed: 3072
train_split: 0.9
num_workers: 4
state_columns: ${data.state_columns}

wm:
  history_size: 3
  num_preds: 1

data:
  dataset:
    # BC needs history plus its final action block, not a future state label.
    num_steps: ${wm.history_size}
    frameskip: 5
    keys_to_load: ${eval:"['action'] + ${state_columns}"}
    keys_to_cache: ${eval:"['action'] + ${state_columns}"}

filter:
  success_key: success
  # Fallback only if success is absent. Count raw stored rows, including the
  # initial observation if recorded: e.g. 101 rows for 100 actions.
  max_episode_length: null

model:
  _target_: stable_worldmodel.wm.bc.StateBC
  architecture: mlp
  state_dim: ${data.state_dim}
  action_dim: 2
  state_columns: ${state_columns}
  history_size: ${wm.history_size}
  frameskip: ${data.dataset.frameskip}
  hidden_dims: [256, 256, 256]

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  shuffle: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

trainer:
  default_root_dir: ${oc.env:STABLEWM_HOME}/checkpoints/${subdir}/pl_trainer
  max_epochs: 10
  max_steps: -1
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
