# @package _global_
# Local launcher configuration (no SLURM)

defaults:
  - override /hydra/launcher: basic

subdir: ${now:%Y-%m-%d_%H-%M-%S}

hydra:
  run:
    dir: ${oc.env:STABLEWM_HOME}/checkpoints/${subdir}/hydra

n_gpus: 1
cpus_per_task: 8
cache_dir: null # Use stable-worldmodel default cache
wandb:
  enabled: true
  config:
    entity: jakd9
    project: stable-wm
    name: ${output_model_name}
    id: ${subdir}
    save_dir: ${oc.env:STABLEWM_HOME}/checkpoints/${subdir}/wandb
    resume: allow
    log_model: False
