defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  mode: task
  env_type: single
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: True
  subgoal_eef_threshold: 0.04
  subgoal_gripper_threshold: 0.05

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from reproducible, oracle-verified environment tasks
eval:
  source: generated_env  # dataset, env, or oracle-verified generated_env
  env_options:
    render_goal: true
  num_eval: 50
  # Used only by dataset source; generated_env uses the full expert rollout.
  goal_offset_steps: 25
  start_from_beginning: false
  goal_from_episode_end: false
  eval_budget: 50
  generated:
    expert_policy:
      _target_: stable_worldmodel.envs.ogbench.ExpertPolicy
      policy_type: markov_oracle
      action_noise: 0.0
      p_random_action: 0.0
      seed: ${seed}
    min_solution_steps: 5
    min_expert_trajectory_distance: 0.10
    random_horizon: ${eval.eval_budget}
    random_trials: 16
    max_attempts: 10000
    progress_interval: 25
    cache_path: null
    force_regenerate: false
    validation_add_pixels: false
    render_during_validation: false
    render_trajectories: false
    render_dir: generated_eval_videos
    dataset_path: null
    dataset_mode: overwrite
    replay_tolerance: 1e-5
    num_subgoals: 4
    subgoal_switch_mode: reached
  img_size: 224
  dataset_name: ogbench/cube_single_expert.h5
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- set target pos
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  filename: ogb_cube_results.txt
