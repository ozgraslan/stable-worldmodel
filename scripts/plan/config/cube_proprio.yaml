defaults:
  - cube
  - _self_

# The training dataset exposes robot state as `observation`, while the model
# consumes it as `proprio`. Apply the same mapping to dataset and environment
# observations during evaluation.
dataset:
  keys_to_cache:
    - action
    - observation
  keys_to_merge:
    proprio: observation

world:
  extra_wrappers:
    - _target_: stable_worldmodel.wrapper.MapKeysWrapper
      _partial_: true
      key_map:
        observation: proprio
